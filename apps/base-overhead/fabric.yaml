# 隔离后端配置
# 可选值: mpk, ept, trustzone, software

# cross-domain.c — 链式拓扑，每跳只跨相邻 fabric
isolation:
  backend: mpk

comp1:
  fabrics:
    fabric-1:
      default: true
      libs:
        - fabric-core
        - flexos-core
        - example1
    fabric-2:
      libs:
        - example2
    fabric-3:
      libs:
        - example3
    fabric-4:
      libs:
        - example4
    fabric-5:
      libs:
        - example5
  edges:
    - [fabric-1, fabric-2]
    - [fabric-2, fabric-3]
    - [fabric-3, fabric-4]
    - [fabric-4, fabric-5]

