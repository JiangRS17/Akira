specification: '0.6'
name: nginx
unikraft:
  version: 698f1aa
  kconfig:
  - CONFIG_LIBUK9P=y
  - CONFIG_LIB9PFS=y
  - CONFIG_LIBDEVFS=y
  - CONFIG_LIBDEVFS_AUTOMOUNT=y
  - CONFIG_LIBVFSCORE_AUTOMOUNT_ROOTFS=y
  - CONFIG_LIBVFSCORE_ROOTFS_9PFS=y
  - CONFIG_LIBUKLIBPARAM=y
  - CONFIG_LIBUKDEBUG=y
  - CONFIG_LIBUKALLOC=y
  - CONFIG_LIBUKSCHED=y
  - CONFIG_LIBPOSIX_SYSINFO=y
  - CONFIG_LIBPOSIX_LIBDL=y
  - CONFIG_LIBFLEXOS=y
  - CONFIG_LIBFABRICCORE=y
targets:
- architecture: x86_64
  platform: kvm
compartments:
- name: comp1
  mechanism:
    driver: vmept
    noisolstack: false
  default: true
- name: comp2
  mechanism:
    driver: vmept
    noisolstack: true
- name: comp3
  mechanism:
    driver: vmept
    noisolstack: true
libraries:
  tlsf:
    version: 26e4c90
    kconfig:
    - CONFIG_LIBTLSF=y
    compartment: comp1
  pthread-embedded:
    version: dc677a0
    compartment: comp1
  newlib:
    version: 2df63fd
    kconfig:
    - CONFIG_LIBNEWLIBC=y
    compartment: comp1
  lwip:
    version: 03d12cb
    kconfig:
    - CONFIG_LWIP_UKNETDEV=y
    - CONFIG_LWIP_TCP=y
    - CONFIG_LWIP_WND_SCALE=y
    - CONFIG_LWIP_TCP_KEEPALIVE=y
    - CONFIG_LWIP_THREADS=y
    - CONFIG_LWIP_SOCKET=y
    - CONFIG_LWIP_AUTOIFACE=y
    - CONFIG_LWIP_IPV4=y
    - CONFIG_LWIP_DHCP=y
    - CONFIG_LWIP_DNS=y
    compartment: comp3
  nginx:
    version: df30833
    kconfig:
    - CONFIG_LIBNGINX_MAIN_FUNCTION=y
    compartment: comp1
  uksched:
    compartment: comp2
    is_core: true
  ukschedcoop:
    compartment: comp2
    is_core: true
volumes: {}
networks: {}
