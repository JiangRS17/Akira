# FlexOS 风格：隔离 TCP/IP 栈（lwip）
isolation:
  backend: ept

comp1:
  fabrics:
    fabric-1:
      default: true
      libs:
        - fabric-core
        - flexos-core
        - redis
        - newlib
        - tlsf
        - pthread-embedded
    fabric-2:
      libs:
        - lwip
  edges:
    - [fabric-1, fabric-2]
