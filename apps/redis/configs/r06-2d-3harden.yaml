# (6) 2 domains: (redis+newlib) | (uksched+lwip), hardened: redis+uksched+lwip
isolation:
  backend: ept

hardening:
  - redis
  - uksched
  - lwip

comp1:
  fabrics:
    fabric-1:
      default: true
      libs:
        - fabric-core
        - flexos-core
        - redis
        - newlib
        - tlsf
        - pthread-embedded
    fabric-2:
      libs:
        - uksched
        - ukschedcoop
        - lwip
  edges:
    - [fabric-1, fabric-2]
